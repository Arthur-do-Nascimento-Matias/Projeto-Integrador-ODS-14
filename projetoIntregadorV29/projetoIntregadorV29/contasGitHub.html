        body {
            box-sizing: border-box;
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117, #21262d, #30363d);
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
            
        }




                .button {
  display: block;
  position: relative;
  width: 56px;
  height: 56px;
  margin: 0;
  padding: 0;
  top: 10px;
  margin-left: 155px;
  overflow: hidden;
  outline: none;
  background-color: transparent;
  cursor: pointer;
  border: 0;
  transition: all 300ms ease;
}

.button:before,
.button:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
}

.button:before {
  border: 4px solid #f0eeef;
  transition:
    opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
    transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
}

.button:after {
  border: 4px solid #2c9b41;
  transform: scale(1.3);
  transition:
    opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
    transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  opacity: 0;
}

.button:hover:before,
.button:focus:before {
  opacity: 0;
  transform: scale(0.7);
  transition:
    opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
    transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.button:hover:after,
.button:focus:after {
  opacity: 1;
  transform: scale(1);
  transition:
    opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
    transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
}

.button-box {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.button-elem {
  display: block;
  width: 20px;
  height: 20px;
  margin: 17px 18px 0 18px;
  transform: rotate(180deg);
  fill: #f0eeef;
}

.button:hover .button-box,
.button:focus .button-box {
  transition: 0.4s;
  transform: translateX(-56px);
}


        

        .floating-bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            background: rgba(33, 136, 56, 0.1);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .bubble:nth-child(1) {
            width: 40px;
            height: 40px;
            top: 80%;
            left: 10%;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .bubble:nth-child(3) {
            width: 30px;
            height: 30px;
            bottom: 70%;
            left: 80%;
            animation-delay: 4s;
        }

        .bubble:nth-child(4) {
            width: 50px;
            height: 50px;
            top: 30%;
            left: 60%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header h1:first-child {
            font-size: 3rem;
            color: #58a6ff;
        }

        .header h1:last-child {
            font-size: 2rem;
            opacity: 0.9;
        }

        #logoGitHub {
            width: 50px;
            height: 50px;
        }

        .programmers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .programmer-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .programmer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(33, 136, 56, 0.3), transparent);
            transition: left 0.8s ease;
        }

        .programmer-card:hover {
            transform: translateY(-10px);
        }

        .programmer-card:hover::before {
            left: 100%;
        }

        .opc {
        position: relative; 
        display: inline-block; 
       }

      .opc::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent 65%);
      border-radius: 3vh; 
      pointer-events: none; 
      transition: background-color 0.3s ease;
    }
    
    .opc {
    overflow: hidden; 
    border-radius: 3vh; 
}

.opc img.fotos {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 3vh;
    transition: transform 0.5s ease; 
}

.opc:hover img.fotos {
    transform: scale(1.30); 
    
}

        .programmer-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #21262d, #30363d);
            border: 2px solid #58a6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin: 0 auto 15px;
        }

        .programmer-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #f0f6fc;
        }

        .programmer-handle {
            font-size: 0.9rem;
            color: #7d8590;
            margin-bottom: 15px;
        }

        .follow-btn {
            background: linear-gradient(45deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .follow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 134, 54, 0.4);
        }

        .programmer-info {
            margin-top: 12px;
            background: #0d1117;
            border: 1px solid #21262d;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: #8b949e;
            line-height: 1.3;
        }
        

        @media (max-width: 768px) {
            .header h1:first-child {
                font-size: 2rem;
            }

            .header h1:last-child {
                font-size: 1.5rem;
            }

            .programmers-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .programmer-card {
                padding: 25px;
            }
        }
    </style>
